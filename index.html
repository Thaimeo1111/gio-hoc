<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giờ học của cậu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fbeff2; --bg2:#efe6fb; --ink:#4a2c4f; --soft:#8a6a8f; --card:#ffffffcc; --btn:#e0558a; --btnink:#fff; --glow:#ffd5e2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2a1830; --bg2:#1d1730; --ink:#fbe6ef; --soft:#c9a9cc; --card:#3a2342cc; --btn:#f27aa6; --btnink:#2a1830; --glow:#5a2d52; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#2a1830; --bg2:#1d1730; --ink:#fbe6ef; --soft:#c9a9cc; --card:#3a2342cc; --btn:#f27aa6; --btnink:#2a1830; --glow:#5a2d52; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse at 50% 30%,var(--glow),transparent 60%),linear-gradient(160deg,var(--bg),var(--bg2));
  background-color:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
main{width:100%;max-width:440px;text-align:center}
.card{background:var(--card);border-radius:28px;padding:40px 28px;backdrop-filter:blur(6px)}
.heart{font-size:56px;line-height:1;display:block;margin-bottom:18px}
h1{font-size:26px;line-height:1.3;margin:0 0 12px;font-weight:700}
p{margin:0 0 24px;color:var(--soft);line-height:1.6;font-size:16px}
.msg{font-size:22px;line-height:1.55;font-weight:500;color:var(--ink);margin:0 0 28px;min-height:7em;display:flex;align-items:center;justify-content:center}
button{
  font:inherit;font-weight:700;font-size:17px;border:0;cursor:pointer;
  background:var(--btn);color:var(--btnink);padding:14px 32px;border-radius:999px;
}
button:hover{filter:brightness(1.06)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.note{margin:22px 0 0;font-size:14px;color:var(--soft);font-style:italic;letter-spacing:.01em}
#confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section class="card" id="start">
    <span class="heart" aria-hidden="true">🥰</span>
    <h1>Đến giờ học rồi, cậu ơi</h1>
    <p>Bấm nút bên dưới để vào phòng học. Không cần đăng nhập, không cần bật mic hay camera.</p>
    <button id="go">Vào học thôi</button>
  </section>

  <section class="card" id="away" hidden>
    <span class="heart" aria-hidden="true">☕</span>
    <h1>Cậu đang học nhé</h1>
    <p>Học xong thì bấm nút đỏ rời họp, rồi đóng tab Meet lại. Có một lời nhắn nhỏ đang đợi cậu ở đây.</p>
    <button id="done">Mình học xong rồi</button>
  </section>

  <section class="card" id="end" hidden>
    <span class="heart" id="endicon" aria-hidden="true">💛</span>
    <div class="msg" id="msg" aria-live="polite"></div>
    <button id="again">Tiếp theo</button>
    <p class="note">Một chút tích cực sau buổi học cùng nhau</p>
  </section>
</main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
// Dán link Meet của hai cậu vào giữa hai dấu nháy bên dưới
var MEET_URL = "https://meet.google.com/wgf-kagp-pct";

var chain = [
  "Uống một ngụm nước, duỗi vai một chút, rồi mỉm cười nhé. Cậu xứng đáng được nghỉ.",
  "Cậu cố gắng nhiều hơn cậu nghĩ đấy. Tự hào về cậu lắm.",
  "Chúc ngủ ngon."
];
var step = 0, studying = false;
var $ = function(id){return document.getElementById(id)};
function show(id){["start","away","end"].forEach(function(s){$(s).hidden = s!==id; });
  var el=$(id); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");}
function showStep(){
  $("msg").textContent = chain[step];
  var lastStep = step >= chain.length - 1;
  $("again").hidden = lastStep;
  $("endicon").textContent = lastStep ? "🌙" : "💛";
}
function openMeet(){ window.open(MEET_URL, "_blank", "noopener"); studying = true; show("away"); }
function balloons(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = $("confetti"), x = c.getContext("2d"), d = window.devicePixelRatio || 1;
  var W = c.width = innerWidth * d, H = c.height = innerHeight * d;
  var cols = ["#f48fb1","#ce93d8","#9fa8da","#ffcc80","#80cbc4","#ef9a9a"], b = [];
  for (var i = 0; i < 16; i++) {
    var r = (22 + Math.random()*14) * d;
    b.push({x: W*(0.06 + Math.random()*0.88), y: H + r*3 + Math.random()*H*0.35, r: r,
      vy: (1.2 + Math.random()*1.2) * d, ph: Math.random()*6.28, sw: (10 + Math.random()*14) * d, c: cols[i % cols.length]});
  }
  (function f(){
    x.clearRect(0, 0, W, H); var alive = false;
    b.forEach(function(q){
      q.y -= q.vy; q.ph += 0.03;
      if (q.y > -q.r*4) alive = true; else return;
      x.save(); x.translate(q.x + Math.sin(q.ph)*q.sw, q.y); x.rotate(Math.sin(q.ph)*0.12);
      x.beginPath(); x.moveTo(0, q.r*1.2); x.bezierCurveTo(-q.r*0.4, q.r*2, q.r*0.4, q.r*2.6, 0, q.r*3.4);
      x.strokeStyle = "rgba(120,90,130,0.55)"; x.lineWidth = 1.5*d; x.stroke();
      x.fillStyle = q.c; x.beginPath(); x.ellipse(0, 0, q.r*0.82, q.r, 0, 0, 6.2832); x.fill();
      x.beginPath(); x.moveTo(0, q.r); x.lineTo(-q.r*0.14, q.r*1.22); x.lineTo(q.r*0.14, q.r*1.22); x.closePath(); x.fill();
      x.fillStyle = "rgba(255,255,255,0.55)"; x.beginPath(); x.ellipse(-q.r*0.3, -q.r*0.35, q.r*0.16, q.r*0.28, 0.5, 0, 6.2832); x.fill();
      x.restore();
    });
    if (alive) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })();
}
function finish(){ studying = false; step = 0; showStep(); show("end"); balloons(); }

$("go").addEventListener("click", openMeet);
$("done").addEventListener("click", finish);
$("again").addEventListener("click", function(){ if (step < chain.length - 1) { step++; showStep(); } });

// Khi cậu ấy quay lại tab này sau khi học, tự hiện lời nhắn
var armedAt = 0;
function leave(){ if (!armedAt) armedAt = Date.now(); }
function back(){
  if (studying && armedAt && Date.now() - armedAt > 5000) { armedAt = 0; finish(); }
  else if (!document.hidden) { armedAt = 0; }
}
document.addEventListener("visibilitychange", function(){ if (document.hidden) leave(); else back(); });
window.addEventListener("blur", leave);
window.addEventListener("focus", back);
</script>
</body>
</html>
